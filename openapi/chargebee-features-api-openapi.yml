tags:
- name: Features
paths:
  /features:
    get:
      summary: List features
      operationId: list_features
      parameters:
      - description: The device from which the customer has made the request
        $ref: '#/components/parameters/chargebee-request-origin-device'
      - description: The email address of your customer/user. Use this when the email address has only ASCII characters.
        $ref: '#/components/parameters/chargebee-request-origin-user'
      - description: The Base64-encoded email address of your customer/user. Use this if the email address has UTF-8 characters. When this header is provided, the header chargebee-request-origin-user is ignored.
        $ref: '#/components/parameters/chargebee-request-origin-user-encoded'
      - description: The IP address of the customer where the request originated
        $ref: '#/components/parameters/chargebee-request-origin-ip'
      - description: If the site has multiple business entities, you can use this custom HTTP header to specify the business entity for which Chargebee should perform the operation.
        $ref: '#/components/parameters/chargebee-business-entity-id'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: name
        in: query
        required: false
        deprecated: false
        style: deepObject
        explode: true
        schema:
          type: object
          deprecated: false
          description: 'A case-sensitive unique name for the feature. For example: `user license`, `data storage`, `Salesforce Integration`, `devices`, `UHD Streaming`, and so on. **Note:** This name is not displayed on any customer-facing documents or pages such as [invoice PDFs](invoices#retrieve_invoice_as_pdf) or [hosted pages](hosted_pages). However, in the future, it is likely to be introduced on the [Self-Serve Portal](portal_sessions).

            '
          example: User licenses
          x-cb-parameter-blank-option: not_allowed
          x-cb-attribute-meta-comment: optional
          x-cb-is-multi-value-attribute: true
          x-cb-is-filter-parameter: true
          x-cb-meta-model-name: features
          x-cb-is-api-column: true
          x-cb-sdk-filter-name: StringFilter
          x-cb-sort-order: 2
          properties:
            is:
              type: string
              minLength: 1
              example: null
            is_not:
              type: string
              minLength: 1
              example: null
            starts_with:
              type: string
              minLength: 1
              example: null
            in:
              type: string
              pattern: ^\[(.*)(,.*)*\]$
              example: null
            not_in:
              type: string
              pattern: ^\[(.*)(,.*)*\]$
              example: null
      - name: id
        in: query
        required: false
        deprecated: false
        style: deepObject
        explode: true
        schema:
          type: object
          deprecated: false
          description: 'A unique and immutable identifier for the feature. You can set it yourself, in which case it is recommended that a human-readable format (or slug) be used. For example, `number-of-users-ccjht01`. When not provided, a random value is automatically set.

            '
          example: fea-user-licenses
          x-cb-parameter-blank-option: not_allowed
          x-cb-attribute-meta-comment: optional
          x-cb-is-multi-value-attribute: true
          x-cb-is-filter-parameter: true
