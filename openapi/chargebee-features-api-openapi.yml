      - name: status
        in: query
        required: false
        deprecated: false
        style: deepObject
        explode: true
        schema:
          type: object
          deprecated: false
          description: The current status of the feature.
          example: active
          x-cb-parameter-blank-option: as_null
          x-cb-attribute-meta-comment: optional
          x-cb-is-filter-parameter: true
          x-cb-meta-model-name: features
          x-cb-is-api-column: true
          x-cb-sdk-filter-name: EnumFilter
          x-cb-is-multi-value-attribute: false
          x-cb-sort-order: 4
          properties:
            is:
              type: string
              description: '* `active` - A `draft` or an `archived` feature can be changed to `active`. Any [item](item_entitlements) or [subscription entitlements](subscription_entitlements) defined for the feature take effect immediately.

                * `archived` - An `active` feature can be changed to `archived`. Once `archived`, no **new** [item](item_entitlements) or [subscription entitlements](subscription_entitlements) can be created for the feature. However, any pre-existing item or subscription entitlements from the time that the feature was `active`, remain effective.

                * `draft` - The feature is in an unpublished state. [Item](item_entitlements) and [subscription entitlements](subscription_entitlements) can be created for a draft feature but they are not effective until the feature is active. A feature `status` cannot be changed back to `draft` once it is in `active` or `archived` `status`.

                '
              enum:
              - active
              - archived
              - draft
              x-cb-is-external-enum: false
              x-cb-is-api-column: true
              x-cb-is-gen-separate: false
              x-cb-sdk-enum-api-name: Status
              example: null
            is_not:
              type: string
              description: '* `active` - A `draft` or an `archived` feature can be changed to `active`. Any [item](item_entitlements) or [subscription entitlements](subscription_entitlements) defined for the feature take effect immediately.

                * `archived` - An `active` feature can be changed to `archived`. Once `archived`, no **new** [item](item_entitlements) or [subscription entitlements](subscription_entitlements) can be created for the feature. However, any pre-existing item or subscription entitlements from the time that the feature was `active`, remain effective.

                * `draft` - The feature is in an unpublished state. [Item](item_entitlements) and [subscription entitlements](subscription_entitlements) can be created for a draft feature but they are not effective until the feature is active. A feature `status` cannot be changed back to `draft` once it is in `active` or `archived` `status`.

                '
              enum:
              - active
              - archived
              - draft
              x-cb-is-external-enum: false
              x-cb-is-api-column: true
              x-cb-is-gen-separate: false
              x-cb-sdk-enum-api-name: Status
              example: null
            in:
              type: string
              description: '* `active` - A `draft` or an `archived` feature can be changed to `active`. Any [item](item_entitlements) or [subscription entitlements](subscription_entitlements) defined for the feature take effect immediately.

                * `archived` - An `active` feature can be changed to `archived`. Once `archived`, no **new** [item](item_entitlements) or [subscription entitlements](subscription_entitlements) can be created for the feature. However, any pre-existing item or subscription entitlements from the time that the feature was `active`, remain effective.

                * `draft` - The feature is in an unpublished state. [Item](item_entitlements) and [subscription entitlements](subscription_entitlements) can be created for a draft feature but they are not effective until the feature is active. A feature `status` cannot be changed back to `draft` once it is in `active` or `archived` `status`.

