                * `complete` - Order has been processed successfully. Applicable only if you are using Chargebee''s legacy order management system

                * `cancelled` - Order has been cancelled. Applicable only if you are using Chargebee''s legacy order management system

                * `voided` - Order has been voided. Applicable only if you are using Chargebee''s legacy order management system

