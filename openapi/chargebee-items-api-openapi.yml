          example: SUM_OF_USAGES
          x-cb-parameter-blank-option: as_null
          x-cb-attribute-meta-comment: optional
          x-cb-is-filter-parameter: true
          x-cb-meta-model-name: items
          x-cb-is-api-column: true
          x-cb-sdk-filter-name: EnumFilter
          x-cb-is-multi-value-attribute: false
          x-cb-sort-order: 13
          properties:
            is:
              type: string
              description: '* `sum_of_usages` - the net quantity is the sum of the `quantity` of all usages for the current term.

                * `last_usage` - from among the usage records for the [item price](/docs/api/subscriptions?prod_cat_ver=2#subscription_subscription_items_item_price_id) with `usage_date` within the relevant billing period, the `quantity` of the usage record with the most recent `usage_date` is taken as the net quantity consumed.

                * `max_usage` - from among the usage records for the [item price](/docs/api/subscriptions?prod_cat_ver=2#subscription_subscription_items_item_price_id) with `usage_date` within the relevant billing period, the `quantity` of the usage record with the maximum value is taken as the net quantity consumed.

                '
              enum:
