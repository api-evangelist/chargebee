                * `addon` - A recurring component that can be added to a subscription in addition to its plan.

                * `charge` - A non-recurring component that can be added to a subscription in addition to its plan. An charge can also be applied to a customer [directly](./invoices?prod_cat_ver=2#create_invoice_for_a_charge-item) without being applied to a subscription.

