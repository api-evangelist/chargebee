              pattern: ^\[(.*)(,.*)*\]$
              example: null
      - name: payment_source_id
        in: query
        required: false
        deprecated: false
        style: deepObject
        explode: true
        schema:
          type: object
          deprecated: false
          description: To filter based on Transaction payment source id.
          example: pm_3Nl8XXUQUXDVFa2
          x-cb-parameter-blank-option: as_null
          x-cb-attribute-meta-comment: optional
          x-cb-is-multi-value-attribute: true
          x-cb-is-presence-operator-supported: true
          x-cb-is-filter-parameter: true
          x-cb-meta-model-name: transactions
          x-cb-is-api-column: true
          x-cb-sdk-filter-name: StringFilter
          x-cb-sort-order: 6
          properties:
