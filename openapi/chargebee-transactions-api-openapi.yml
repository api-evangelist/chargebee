openapi: 3.2.0
info:
  title: Chargebee Transactions API
  contact:
    name: Chargebee Support
    url: https://www.chargebee.com
    email: support@chargebee.com
  version: 2026-09-24.553c79154f0075cfbab35271eeff8b63a3ed6a86
  x-cb-product-catalog-version: 2
  x-cb-api-version: 2
servers:
- url: '{protocol}://{site}.{environment}:{port}/api/v2'
  variables:
    protocol:
      default: https
      enum:
      - https
    site:
      default: demo
    environment:
      default: chargebee.com
      enum:
      - chargebee.com
    port:
      default: '443'
      enum:
      - '443'
- url: '{protocol}://{site}-test.{environment}:{port}/api/v2'
  variables:
    protocol:
      default: https
      enum:
      - https
    site:
      default: demo
    environment:
      default: chargebee.com
      enum:
      - chargebee.com
    port:
      default: '443'
      enum:
      - '443'
tags:
- name: Transactions
paths:
  /transactions:
    get:
      summary: List transactions
      operationId: list_transactions
      parameters:
      - description: The device from which the customer has made the request
        $ref: '#/components/parameters/chargebee-request-origin-device'
      - description: The email address of your customer/user. Use this when the email address has only ASCII characters.
        $ref: '#/components/parameters/chargebee-request-origin-user'
      - description: The Base64-encoded email address of your customer/user. Use this if the email address has UTF-8 characters. When this header is provided, the header chargebee-request-origin-user is ignored.
        $ref: '#/components/parameters/chargebee-request-origin-user-encoded'
      - description: The IP address of the customer where the request originated
        $ref: '#/components/parameters/chargebee-request-origin-ip'
      - description: If the site has multiple business entities, you can use this custom HTTP header to specify the business entity for which Chargebee should perform the operation.
        $ref: '#/components/parameters/chargebee-business-entity-id'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: include_deleted
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
          description: Indicates whether to include deleted objects in the list. The deleted objects have the attribute `deleted` as `true`.
          x-cb-sort-order: 2
          example: null
      - name: id
        in: query
        required: false
        deprecated: false
        style: deepObject
        explode: true
        schema:
          type: object
          deprecated: false
          description: Uniquely identifies the transaction.
          example: txn_88ybdbsnvf2
          x-cb-parameter-blank-option: not_allowed
          x-cb-attribute-meta-comment: optional
          x-cb-is-multi-value-attribute: true
          x-cb-is-filter-parameter: true
          x-cb-meta-model-name: transactions
          x-cb-is-api-column: true
          x-cb-sdk-filter-name: StringFilter
          x-cb-sort-order: 3
          properties:
            is:
              type: string
              minLength: 1
              example: null
            is_not:
              type: string
              minLength: 1
              example: null
            starts_with:
              type: string
              minLength: 1
              example: null
            in:
              type: string
              pattern: ^\[(.*)(,.*)*\]$
              example: null
            not_in:
              type: string
              pattern: ^\[(.*)(,.*)*\]$
              example: null
      - name: customer_id
        in: query
        required: false
        deprecated: false
        style: deepObject
        explode: true
        schema:
          type: object
          deprecated: false
          description: Identifier of the customer for which this transaction is made
          example: 5hjdk8nOpd
          x-cb-parameter-blank-option: as_null
          x-cb-attribute-meta-comment: optional
          x-cb-is-multi-value-attribute: true
          x-cb-is-presence-operator-supported: true
          x-cb-is-filter-parameter: true
          x-cb-meta-model-name: transactions
          x-cb-is-api-column: true
          x-cb-sdk-filter-name: StringFilter
          x-cb-sort-order: 4
          properties:
            is:
              type: string
              minLength: 1
              example: null
            is_not:
              type: string
              minLength: 1
              example: null
            starts_with:
              type: string
              minLength: 1
              example: null
            is_present:
              type: string
              format: boolean
              enum:
              - 'true'
              - 'false'
              example: null
            in:
              type: string
              pattern: ^\[(.*)(,.*)*\]$
              example: null
            not_in:
              type: string
              pattern: ^\[(.*)(,.*)*\]$
              example: null
      - name: subscription_id
        in: query
        required: false
        deprecated: false
        style: deepObject
        explode: true
        schema:
          type: object
          deprecated: false
          description: Identifier of the subscription for which this transaction is made.
          example: 5hjdk8nOpd
          x-cb-parameter-blank-option: as_null
          x-cb-attribute-meta-comment: optional
