          x-cb-sdk-filter-name: EnumFilter
          x-cb-is-multi-value-attribute: false
          x-cb-sort-order: 6
          properties:
            is:
              type: string
              description: '* `active` - Can be applied to a subscription.

                * `expired` - Cannot be applied to a subscription. A coupon may expire due to exceeding [max_redemptions](/docs/api/coupons?#coupon_max_redemptions) or [valid_till](/docs/api/coupons?#coupon_valid_till) date is past. Existing associations remain unaffected.

                * `archived` - Cannot be applied to a subscription. Existing associations remain unaffected.

                * `deleted` - Indicates the coupon has been deleted.

                * `future` - The coupon is scheduled to start at a future date and cannot be applied to a subscription. From the valid_from date, the status changes to active.

                '
              enum:
              - active
              - expired
              - archived
              - deleted
              - future
              x-cb-is-external-enum: false
              x-cb-is-api-column: true
              x-cb-is-gen-separate: false
