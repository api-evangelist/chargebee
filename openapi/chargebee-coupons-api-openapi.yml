tags:
- name: Coupons
paths:
  /coupons:
    get:
      summary: List coupons
      operationId: list_coupons
      parameters:
      - description: The device from which the customer has made the request
        $ref: '#/components/parameters/chargebee-request-origin-device'
      - description: The email address of your customer/user. Use this when the email address has only ASCII characters.
        $ref: '#/components/parameters/chargebee-request-origin-user'
      - description: The Base64-encoded email address of your customer/user. Use this if the email address has UTF-8 characters. When this header is provided, the header chargebee-request-origin-user is ignored.
        $ref: '#/components/parameters/chargebee-request-origin-user-encoded'
      - description: The IP address of the customer where the request originated
        $ref: '#/components/parameters/chargebee-request-origin-ip'
      - description: If the site has multiple business entities, you can use this custom HTTP header to specify the business entity for which Chargebee should perform the operation.
        $ref: '#/components/parameters/chargebee-business-entity-id'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: id
        in: query
        required: false
        deprecated: false
        style: deepObject
        explode: true
        schema:
          type: object
          deprecated: false
          description: "Used to uniquely identify the coupon in your website/application and to integrate with Chargebee.  \n**Note:**\n\n\nWhen the coupon ID contains a special character; for example: `#`, the API returns an error.\nMake sure that you [encode](https://www.urlencoder.org/) the coupon ID in the path parameter before making an API call.\n"
          example: OFF2008
          x-cb-parameter-blank-option: not_allowed
          x-cb-attribute-meta-comment: optional
          x-cb-is-multi-value-attribute: true
          x-cb-is-filter-parameter: true
          x-cb-meta-model-name: coupons
          x-cb-is-api-column: true
          x-cb-sdk-filter-name: StringFilter
          x-cb-sort-order: 2
          properties:
            is:
              type: string
              minLength: 1
              example: null
            is_not:
              type: string
              minLength: 1
              example: null
            starts_with:
              type: string
              minLength: 1
              example: null
            in:
              type: string
              pattern: ^\[(.*)(,.*)*\]$
              example: null
            not_in:
              type: string
              pattern: ^\[(.*)(,.*)*\]$
              example: null
      - name: name
        in: query
        required: false
        deprecated: false
        style: deepObject
        explode: true
        schema:
          type: object
          deprecated: false
          description: "The display name used in web interface for identifying the coupon.  \n**Note:**\n\n\nWhen the name of the coupon set contains a special character; for example: `#`, the API returns an error.\nMake sure that you [encode](https://www.urlencoder.org/) the name of the coupon set in the path parameter before making an API call.\n"
          example: Offer 10
          x-cb-parameter-blank-option: not_allowed
          x-cb-attribute-meta-comment: optional
          x-cb-is-multi-value-attribute: true
          x-cb-is-filter-parameter: true
          x-cb-meta-model-name: coupons
