              - forever
              - limited_period
              x-cb-is-external-enum: false
              x-cb-is-api-column: true
              x-cb-is-gen-separate: false
              x-cb-sdk-enum-api-name: DurationType
              pattern: ^\[(one_time|forever|limited_period)(,(one_time|forever|limited_period))*\]$
              example: null
            not_in:
              type: string
              description: '* `one_time` - The coupon stays attached to the subscription till it is applied on an invoice **once**. It is removed after that from the subscription.

                * `forever` - The coupon is attached to the subscription and applied on the invoices until explicitly removed.

                * `limited_period` - The discount is attached to the subscription and applied on the invoices for a limited duration. This duration starts from the point it is applied to an invoice for the first time and expires after a period specified by `period` and `period_unit`.

