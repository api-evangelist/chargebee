          x-cb-sdk-filter-name: EnumFilter
          x-cb-is-multi-value-attribute: false
          x-cb-sort-order: 4
          properties:
            is:
              type: string
              description: '* `fixed_amount` - The specified amount will be deducted.

                * `percentage` - The specified percentage will be deducted.

                * `offer_quantity` - The specified units will be offered without any deduction.'
              enum:
              - fixed_amount
              - percentage
              - offer_quantity
              x-cb-is-external-enum: false
              x-cb-is-api-column: true
              x-cb-is-gen-separate: false
