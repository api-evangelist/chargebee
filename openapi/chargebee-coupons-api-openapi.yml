            in:
              type: string
              pattern: ^\[(.*)(,.*)*\]$
              example: null
            not_in:
              type: string
              pattern: ^\[(.*)(,.*)*\]$
              example: null
      - name: discount_type
        in: query
        required: false
        deprecated: false
        style: deepObject
        explode: true
        schema:
          type: object
          deprecated: false
          description: The type of deduction
          example: fixed_amount
