servers:
- url: '{protocol}://{site}.{environment}:{port}/api/v2'
  variables:
    protocol:
      default: https
      enum:
      - https
    site:
      default: demo
    environment:
      default: chargebee.com
      enum:
      - chargebee.com
    port:
      default: '443'
