        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                export_type:
                  type: string
                  default: data
                  deprecated: false
                  enum:
                  - data
                  - import_friendly_data
                  x-cb-parameter-blank-option: not_allowed
                  x-cb-attribute-meta-comment: optional
                  x-cb-is-api-column: true
                  x-cb-is-global-enum: true
                  x-cb-is-external-enum: true
                  x-cb-is-gen-separate: true
                  x-cb-is-ignore-generation: false
                  x-cb-sdk-enum-api-name: ExportType
                  x-cb-global-enum-reference: ./schemas/enums/ExportType.yaml
                  x-cb-sort-order: 0
                  example: null
                business_entity_id:
                  type: object
                  deprecated: false
                  description: "The unique ID of the [business entity](/docs/api?prod_cat_ver=2#mbe) of this subscription. This is always the same as the [business entity](/docs/api/subscriptions?prod_cat_ver=2#subscription_customer_id) of the customer.  \nThe ID of the business entity created for the site. For Product Catalog 1.0, all the site data is tied to this business entity.  \n**Note**\n\n[Multiple Business Entities](/docs/api?prod_cat_ver=2#mbe) is a feature available only on Product Catalog 2.0.\n"
                  example: business_entity_id
                  x-cb-parameter-blank-option: as_null
