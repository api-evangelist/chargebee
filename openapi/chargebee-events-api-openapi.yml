          x-cb-sdk-filter-name: EnumFilter
          x-cb-is-multi-value-attribute: false
          x-cb-sort-order: 8
          properties:
            is:
              type: string
              description: "* `coupon_created` - Sent when a coupon is created. \n* `coupon_updated` - Sent when a coupon is changed. \n* `coupon_deleted` - Sent when a coupon is deleted. \n* `coupon_set_created` - Sent when a coupon set is created\n* `coupon_set_updated` - Sent when a coupon set is changed\n* `coupon_set_deleted` - Sent when a coupon set is deleted\n* `coupon_codes_added` - Sent when coupon codes are added in coupon set\n* `coupon_codes_deleted` - Sent when coupon codes are deleted in coupon set\n* `coupon_codes_updated` - Sent when coupon codes are updated\n* `customer_created` - Sent when a customer is created. This event happens when only a new customer is created or when a customer is automatically created during new subscription creation.\n* `customer_changed` - Sent when a customer is changed\n* `customer_deleted` - Sent when a customer is deleted\n* `customer_moved_out` - Sent when a customer is copied to another site\n* `customer_moved_in` - Sent when a customer is copied from another site\n* `promotional_credits_added` - Sent when a customer prmotion credits added\n* `promotional_credits_deducted` - Sent when a customer prmotion credits deducted\n* `subscription_created` - Sent when a new subscription is created.\n* `subscription_created_with_backdating` - Sent when a new subscription is created with backdating.\n* `subscription_started` - Sent when a 'future' subscription gets started at the scheduled date.\n* `subscription_trial_end_reminder` - Sent when the customer's trial period is about to end.\n* `subscription_activated` - Sent after the subscription has been moved from trial to active state\n* `subscription_activated_with_backdating` - Sent after the subscription changes to `active` from another `status`, while the change is backdated.\n* `subscription_changed` - Sent after the subscription's recurring items have been changed\n* `subscription_trial_extended` - Trial Extension\n* `mrr_updated` - Sent when either of MRR or CMRR of a subscription changes\n* `subscription_changed_with_backdating` - Sent after the subscription's recurring items have been changed with backdated date\n* `subscription_cancellation_scheduled` - Sent when subscription is scheduled to cancel at end of current term\n* `subscription_cancellation_reminder` - Sent when the customer's subscription is nearing it's scheduled cancellation date.\n* `subscription_cancelled` - Sent when the subscription gets cancelled. If cancelled due to non payment or card not present, the subscription will have the possible reason as 'cancel_reason'.\n* `subscription_canceled_with_backdating` - Sent when the subscription gets cancelled. If cancelled due to non payment or card not present, the subscription will have the possible reason as 'cancel_reason'.\n* `subscription_reactivated` - Sent when the subscription is moved from cancelled state to active or in_trial state\n* `subscription_reactivated_with_backdating` - Sent when the subscription is moved from cancelled state to active or in_trial state with past date\n* `subscription_renewed` - Sent when the subscription is renewed from the current term.\n* `subscription_items_renewed` - Sent when one or more Subscription Items are renewed\n* `subscription_scheduled_cancellation_removed` - Sent when scheduled cancellation is removed for the subscription.\n* `subscription_changes_scheduled` - Sent when subscription changes are scheduled for later. Changes will be applied at the end of current term.\n* `subscription_scheduled_changes_removed` - Sent when scheduled change for the subscription is removed.\n* `subscription_shipping_address_updated` - Triggered when shipping address is added or updated for a subscription.\n* `subscription_deleted` - Sent when a subscription has been deleted\n* `subscription_paused` - Sent when the subscription is paused.\n* `subscription_pause_scheduled` - Sent when the subscription is scheduled to pause.\n* `subscription_scheduled_pause_removed` - Triggered when scheduled pause is removed for the subscription.\n* `subscription_resumed` - Sent when the subscription is moved from paused state to active state\n* `subscription_resumption_scheduled` - Triggered when the subscription resumption is scheduled.\n* `subscription_scheduled_resumption_removed` - Triggered when scheduled resumption is removed for the subscription.\n* `subscription_advance_invoice_schedule_added` - Triggered when advance invoice is scheduled for a subscription.\n* `subscription_advance_invoice_schedule_updated` - Triggered when scheduled advance invoice is updated for a subscription.\n* `subscription_advance_invoice_schedule_removed` - Triggered when scheduled advance invoice is removed for a subscription.\n* `pending_invoice_created` - Event triggered (in the case of metered billing) when a \"Pending\" invoice is created that has usage related charges or line items to be added, before being closed. This is triggered only when the “Notify for Pending Invoices” option is enabled.\n* `pending_invoice_updated` - Event triggered when the option \"Notify and wait to close invoices\" is enabled, and the 'Pending' invoice is updated.\n* `invoice_generated` - Event triggered when a new invoice is generated. In case of metered billing, this event is triggered when a \"Pending\" invoice is closed.\n* `invoice_generated_with_backdating` - Event triggered when a new invoice is generated with past date as invoice date.\n* `invoice_updated` - Triggered when the invoice’s shipping/billing address is updated, if the invoice is voided, or when the amount due is modified due to payments applied/removed.\n* `invoice_deleted` - Event triggered when an invoice is deleted.\n* `credit_note_created` - Sent when a credit note is created\n* `credit_note_created_with_backdating` - Sent when a credit note is created with past date as credit note date\n* `credit_note_updated` - Sent when a credit note is updated\n* `credit_note_deleted` - Sent when a credit note is deleted\n* `einvoice_created` - Triggered when an e-invoice is created for an invoice or credit note.\n* `einvoice_updated` - Triggered when an e-invoice is updated (for example status or provider response changes).\n* `payment_schedules_created` - Event triggered when new payment schedules are created for an invoice\n* `payment_schedules_updated` - Event triggered when payment schedules are updated for an invoice\n* `payment_schedule_scheme_created` - Event triggered when a new payment schedule scheme is created\n* `payment_schedule_scheme_deleted` - Event triggered when a payment schedule scheme is deleted\n* `subscription_renewal_reminder` - Sent before each subscription's renewal based on plan's period\n* `add_usages_reminder` - Sent every month day before renewal date of plan's period\n* `payment_due_reminder` - Sent after scheduled days of payment failure\n* `transaction_created` - Triggered when a transaction is recorded\n* `transaction_updated` - Triggered when a transaction is updated. E.g. (1) When a transaction is removed, (2) or when an excess payment is applied on an invoice, (3) or when amount_capturable gets updated.\n* `transaction_deleted` - Triggered when a transaction is deleted. \n* `payment_succeeded` - Sent when the payment is successfully collected\n* `payment_failed` - Sent when attempt to charge customer's credit card fails\n* `dunning_updated` - Sent when dunning is paused for an invoice\n* `payment_refunded` - Sent when a payment refund is made\n* `payment_initiated` - Sent when a payment is initiated via direct debit\n* `refund_initiated` - Sent when a refund is initiated via direct debit\n* `netd_payment_due_reminder` - **(Deprecated)** Sent when a invoice's due period is about to end\n* `authorization_succeeded` - Triggered when a authorization transaction is created.\n* `authorization_voided` - Triggered when a authorization transaction is voided. Authorization can be voided either manually or when blocked funds are released by the gateway after a certain period of time.\n* `card_added` - Sent when a card is added for a customer.\n* `card_updated` - Sent when the card is updated for a customer.\n* `card_expiry_reminder` - Sent when the customer's credit card is expiring soon. Sent 30 days before the expiry date.\n* `card_expired` - Sent when a card for a customer is expired\n* `card_deleted` - Sent when a card is deleted for a customer\n* `payment_source_added` - Sent when a payment source is added for a customer.\n* `payment_source_updated` - Sent when the payment source is updated for a customer or when role is assigned to the payment source.\n* `payment_source_deleted` - Sent when a payment source is deleted for a customer\n* `payment_source_expiring` - Sent when the customer's payment source is expiring soon. Sent 30 days before the expiry date.\n* `payment_source_expired` - Sent when a payment source for a customer is expired\n* `payment_source_locally_deleted` - Sent when a payment source for a customer removed from Chargebee\n* `virtual_bank_account_added` - Sent when a virtual bank account is added for a customer.\n* `virtual_bank_account_updated` - Sent when the virtual bank account is updated for a customer.\n* `virtual_bank_account_deleted` - Sent when a virtual bank account is deleted for a customer.\n* `token_created` - Sent when a Token is created\n* `token_consumed` - Sent when a Token is consumed\n* `token_expired` - Sent when a Token is expired\n* `unbilled_charges_created` - Triggered when unbilled charges are created\n* `unbilled_charges_voided` - Triggered when unbilled charges are voided\n* `unbilled_charges_deleted` - Triggered when unbilled charges are deleted\n* `unbilled_charges_invoiced` - Triggered when unbilled charges are invoiced\n* `order_created` - Triggered when order is created\n* `order_updated` - Triggered when order is updated\n* `order_cancelled` - Triggered when order is cancelled\n* `order_delivered` - Triggered when order is marked as delivered\n* `order_returned` - Triggered when order is marked as returned\n* `order_ready_to_process` - Triggered when order reaches it's order date\n* `order_ready_to_ship` - Triggered when order reaches it's shipping date\n* `order_deleted` - Triggered when order is deleted\n* `order_resent` - Triggered when order is resent\n* `quote_created` - Triggered when quote is created\n* `quote_updated` - Triggered when quote is updated\n* `quote_deleted` - Triggered when quote is deleted\n* `tax_withheld_recorded` - Triggered when a tax withheld is recorded for an invoice\n* `tax_withheld_deleted` - Triggered when a tax withheld is deleted\n* `tax_withheld_refunded` - Sent when a tax withheld refund is made\n* `gift_scheduled` - Triggered when a new gift is created\n* `gift_unclaimed` - Triggered when a new gift is unclaimed and is ready to be claimed\n* `gift_claimed` - Triggered when a gift is claimed\n* `gift_expired` - Triggered when a gift expires\n* `gift_cancelled` - Triggered when a gift is cancelled.\n* `gift_updated` - Triggered when a gift is updated\n* `hierarchy_created` - Triggered when a hierarchy is created\n* `hierarchy_deleted` - Triggered when a hierarchy is deleted\n* `payment_intent_created` - Sent when a Payment intent is created\n* `payment_intent_updated` - Sent when a Payment intent is updated\n* `contract_term_created` - Triggered when new contract term is created\n* `contract_term_renewed` - Triggered when new contract term is renewed\n* `contract_term_terminated` - Triggered when contract term is terminated\n* `contract_term_completed` - Triggered when contract term is completed\n* `contract_term_cancelled` - Triggered when contract term is cancelled\n* `item_family_created` - Triggered when an item family is created\n* `item_family_updated` - Triggered when an item family is updated\n* `item_family_deleted` - Triggered when an item family is deleted\n* `item_created` - Triggered when an item is created\n* `item_updated` - Triggered when an item is updated\n* `item_deleted` - Triggered when an item is deleted\n* `item_price_created` - Triggered when an item price is created\n* `item_price_updated` - Triggered when an item price is updated\n* `item_price_deleted` - Triggered when an item price is deleted\n* `attached_item_created` - Triggered when an Attached item is created\n* `attached_item_updated` - Triggered when an Attached item is updated\n* `attached_item_deleted` - Triggered when an Attached item is deleted\n* `differential_price_created` - Triggered when a differential price is created\n* `differential_price_updated` - Triggered when a differential price is updated\n* `differential_price_deleted` - Triggered when a differential price is deleted\n* `feature_created` - Triggered when a feature is created.\n* `feature_updated` - Triggered when an feature is updated\n* `feature_deleted` - Triggered when a feature is deleted\n* `feature_activated` - Triggered when a feature `status` transitions to `active` for the first time.\n* `feature_reactivated` - Triggered when a feature `status` transitions to `active` for the second time or more.\n* `feature_archived` - Triggered when an feature is archived\n* `item_entitlements_updated` - Triggered when item entitlements are updated to a feature\n* `entitlement_overrides_updated` - Triggered when an override entitlement is updated\n* `entitlement_overrides_removed` - Triggered when an override entitlement is removed\n* `item_entitlements_removed` - Triggered when item entitlements are removed for a feature\n* `entitlement_overrides_auto_removed` - Triggered when Subscription entitlements overrides for a feature are auto removed after expiry\n* `subscription_entitlements_created` - Triggered when subscription entitlements are created for a new subscription\n* `subscription_entitlements_updated` - Triggered when subscription entitlements are updated due to the subscription change event\n* `business_entity_created` - Sent when a business entity is created. \n* `business_entity_updated` - Sent when a business entity is updated. \n* `business_entity_deleted` - Sent when a business entity is deleted. \n* `customer_business_entity_changed` - Sent when a customer's business entity is changed.\n* `subscription_business_entity_changed` - Sent when a subscription's business entity is changed. \n* `payment_source_business_entity_changed` - Sent when a payment source's business entity is changed.\n* `purchase_created` - Triggered when purchase action is completed successfully\n* `voucher_created` - Triggered when a payment voucher is created\n* `voucher_expired` - Triggered when a payment voucher is expired\n* `voucher_create_failed` - Triggered when a payment voucher creation is failed\n* `product_created` - **(Deprecated)** Triggered when the product create is completed successfully\n* `product_updated` - **(Deprecated)** Triggered when the product update is completed successfully\n* `product_deleted` - **(Deprecated)** Triggered when the product delete is completed successfully\n* `variant_created` - **(Deprecated)** Triggered when product variant create completed successfully\n* `variant_updated` - **(Deprecated)** Triggered when product variant update completed successfully\n* `variant_deleted` - **(Deprecated)** Triggered when product variant delete completed successfully\n* `item_price_entitlements_updated` - Triggered when item Price entitlements are updated to a feature\n* `item_price_entitlements_removed` - Triggered when item price entitlements are removed for a feature\n* `subscription_ramp_created` - Triggered when a subscription ramp is created.\n* `subscription_ramp_deleted` - Triggered when a subscription ramp is deleted.\n* `subscription_ramp_applied` - Triggered when a subscription ramp is applied.\n* `subscription_ramp_drafted` - Triggered when a subscription ramp is moved to draft status.\n* `subscription_ramp_updated` - Triggered when a subscription ramp is updated.\n* `price_variant_created` - Triggered when a price variant is created.\n* `price_variant_updated` - Triggered when a price variant is updated.\n* `price_variant_deleted` - Triggered when a price variant is deleted.\n* `customer_entitlements_updated` - Triggered when entitlements for the list of customers got updated.\n* `subscription_moved_in` - Triggered when a subscription moved from other customer\n* `subscription_moved_out` - Triggered when a subscription moved to other customer\n* `subscription_movement_failed` - Triggered when a subscription movement failed\n* `omnichannel_subscription_created` - Triggered when an omnichannel subscription is created\n* `omnichannel_subscription_item_renewed` - Triggered when an omnichannel subscription item is renewed\n* `omnichannel_subscription_item_downgrade_scheduled` - **(Deprecated)** Triggered when an omnichannel subscription item is downgrade is scheduled\n* `omnichannel_subscription_item_scheduled_downgrade_removed` - **(Deprecated)** Triggered when an omnichannel subscription item scheduled downgrade is removed\n* `omnichannel_subscription_item_downgraded` - Triggered when an omnichannel subscription item is downgraded\n* `omnichannel_subscription_item_expired` - Triggered when an omnichannel subscription item is expired\n* `omnichannel_subscription_item_cancellation_scheduled` - Triggered when an omnichannel subscription item is scheduled for cancellation\n* `omnichannel_subscription_item_scheduled_cancellation_removed` - Triggered when an omnichannel subscription item scheduled cancellation is removed\n* `omnichannel_subscription_item_resubscribed` - Triggered when an omnichannel subscription item is resubscribed\n* `omnichannel_subscription_item_upgraded` - Triggered when an omnichannel subscription item is upgraded\n* `omnichannel_subscription_item_cancelled` - Triggered when an omnichannel subscription item is cancelled\n* `omnichannel_subscription_imported` - Triggered when an omnichannel subscription item is imported\n* `omnichannel_subscription_item_grace_period_started` - Triggered when an omni