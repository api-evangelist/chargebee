ustomer\n* `omnichannel_transaction_created` - Triggered when an omnichannel transaction is created\n* `alert_status_changed` - Triggered when the status for an alert changes\n* `omnichannel_subscription_item_updated` - Triggered when an omnichannel subscription item is updated\n* `omnichannel_subscription_item_recovered` - Triggered when an omnichannel subscription item is recovered from grace period or dunning\n* `omnichannel_subscription_item_mrr_updated` - Triggered when an omnichannel subscription item's MRR is updated\n* `ledger_account_balance_updated` - Triggered when a ledger account balance changes for a subscription unit.\n* `grant_blocks_created` - Triggered when one or more grant blocks are created for a subscription unit.\n* `grant_blocks_updated` - Triggered when one or more grant blocks are updated for a subscription unit.\n* `ledger_updated` - Triggered when a batch of ledger operations is persisted for a subscription unit.\n* `business_rule_created` - Triggered when a business rule is created\n* `business_rule_updated` - Triggered when a business rule is updated\n* `business_rule_activated` - Triggered when a business rule is activated\n* `business_rule_deactivated` - Triggered when a business rule is deactivated\n* `business_rule_deleted` - Triggered when a business rule is deleted\n* `business_rule_released` - Triggered when a business rule is released\n* `vault_token_created` - Triggered when a payment method is tokenized and stored in the vault.\n* `vault_token_updated` - Triggered when a vaulted payment method is updated.\n* `vault_token_deleted` - Triggered when a vaulted payment method is deleted from the vault.\n* `business_rules_applied` - Triggered when rules are applied to any entity.\n* `business_ruleset_created` - Triggered when a business ruleset is created\n* `business_ruleset_updated` - Triggered when a business ruleset is updated\n* `business_ruleset_activated` - Triggered when a business ruleset is activated\n* `business_ruleset_d